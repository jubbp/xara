# xara in a container. Run from this directory (docker/):
#
#   cp xara.conf.example xara.conf      # then adjust
#   docker compose --profile unregistered up -d --build
#   docker compose --profile registered   up -d --build
#
# IMPORTANT: both variants use the same host ports and the same state.
# Only run ONE profile at a time. Before switching:
#   docker compose --profile unregistered down   (or --profile registered)

x-xara-common: &xara-common
  restart: unless-stopped
  init: true
  stop_grace_period: 10s
  environment:
    TZ: ${TZ:-Europe/Berlin}
    # PulseAudio/PipeWire (alternative to ALSA, see below):
    # PULSE_SERVER: unix:/run/pulse/native
  volumes:
    - ./xara.conf:/config/xara.conf:ro
    - xara-state:/state
    # PulseAudio/PipeWire instead of ALSA: mount the socket, remove /dev/snd,
    # set "audio = pulse" in xara.conf and enable "user:" below.
    # - ${XDG_RUNTIME_DIR}/pulse/native:/run/pulse/native
  devices:
    - /dev/snd:/dev/snd
    # PTT devices (uncomment only the ones you need):
    # - /dev/hidraw0:/dev/hidraw0                       # cm108 / AIOC
    # - /dev/ttyUSB0:/dev/ttyUSB0                       # rts / dtr
    # - /dev/serial/by-id/usb-XXXX-if00:/dev/serial/by-id/usb-XXXX-if00
  # Host GIDs may differ from the ones in the image. If so, use the host's
  # numeric GIDs (getent group audio dialout plugdev), see README.md.
  group_add:
    - audio
    - dialout
    - plugdev
  # PulseAudio/PipeWire only: container user = host user (the UID must be
  # able to access the socket; "export UID GID" or use fixed numbers).
  # user: "${UID}:${GID}"
  #
  # Ports on localhost only. KISS (8100) and the command/data ports (8300/8301)
  # are NOT authenticated; ui-control lets token holders transmit.
  # For LAN access remove "127.0.0.1:" (all interfaces) or replace it with
  # the host's LAN IP, e.g. "192.168.1.10:8300:8300".
  ports:
    - "127.0.0.1:8300:8300"   # VARA command
    - "127.0.0.1:8301:8301"   # VARA data (always command port + 1)
    - "127.0.0.1:8100:8100"   # KISS
    - "127.0.0.1:8080:8080"   # web UI (only if ui-port is set)
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8300"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  xara:
    <<: *xara-common
    profiles: ["unregistered"]
    image: xara:latest
    container_name: xara
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REGISTERED: "false"

  xara-registered:
    <<: *xara-common
    profiles: ["registered"]
    image: xara:registered
    container_name: xara
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REGISTERED: "true"

volumes:
  xara-state:
